# Typecheck, test, and build. Runs on every pull request, and is called by
# deploy.yml so nothing reaches Cloud Run without passing it first.
#
# Deliberately needs no GCP credentials. `npm run build` prerenders the
# homepage and /adopt, which read Firestore through the Admin SDK — with no
# credentials those reads fail and the pages fall back to their error state,
# exactly as they already do in Cloud Build. The build succeeds either way, and
# because both pages carry `revalidate = 300` the real data arrives at runtime.
# (That fallback is the whole reason `revalidate` is not optional here — see
# the project log, 2026-08-12.)

#
# ── Minutes ──────────────────────────────────────────────────────────────────
# This repo is public, so GitHub's own runners cost nothing today. The filters
# below exist for the day it goes private (2,000 free minutes a month, and each
# job is rounded UP to a whole minute). Replayed over the 41 merges since
# 2026-09-01: CI would run on 37 and deploy on 36, against 39 deploys before.
#
#  - `pull_request` only. There is deliberately no `push` trigger, so a commit
#    on a branch with an open PR is never checked twice.
#  - `paths` lists every file the checks can read. The tests read
#    firestore.rules, storage.rules and scripts/ at the repo root, and
#    scripts/fixtures, so those are in. Add a path here the day a test starts
#    reading a new one, or a change to it will skip the test that guards it.
#  - A docs-only PR therefore shows "no checks reported". That is expected, not
#    a stuck run. A deploy that fails is NOT repaired by the next docs merge any
#    more (docs no longer deploy): re-run it from the Actions tab.
#  - `CI_RUNNER` is a repository variable. Unset, jobs run on GitHub's machines;
#    set it to a runner label to move every job at once. Delete it to move back.

name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run nobody will read. Only for
# pull_request: when deploy.yml calls this workflow, the event is `push` and a
# cancelled check would SKIP the deploy of an earlier commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Node 22 to match the Dockerfile, not the 20.20.2 on the dev machine.
      # CI should exercise the runtime that actually ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Not a gate. A new advisory published against a transitive dependency
      # is not a reason to block an unrelated pull request — but it is
      # absolutely a reason to show a warning on the run. The `overrides` block
      # in package.json is what actually holds this at zero.
      #
      # ⚠️ timeout-minutes is load-bearing and is NOT redundant with
      # continue-on-error. That flag rescues a step that FAILS; it does nothing
      # for one that HANGS. npm's audit endpoint returned Service Unavailable
      # and then hung on 2026-09-03 and again on 2026-09-04, both times eating
      # this job's whole 10-minute budget — so the JOB was cancelled, and a
      # cancelled job SKIPS `Build, push, deploy` entirely. Two merges sat
      # undeployed, reported as "cancelled", which reads like a human pressed
      # the button rather than like a registry outage.
      #
      # With a step timeout the hang becomes a step failure, continue-on-error
      # catches it as designed, and the deploy proceeds. Keep this comfortably
      # under the job's timeout-minutes above.
      - name: Audit production dependencies
        continue-on-error: true
        timeout-minutes: 3
        run: npm audit --omit=dev
